<svg xmlns="http://www.w3.org/2000/svg" width="880" height="272" viewBox="0 0 880 272" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
