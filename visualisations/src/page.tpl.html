<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le droit algérien en 20 graphiques</title>
<meta name="description" content="Vingt graphiques sur le droit algérien tirés du dépôt algeria-law / Twenty charts on Algerian law from the algeria-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.outline { background: transparent !important; border: 2px solid; border-radius: 3px; }
.legend i.diamond { transform: rotate(45deg) scale(.82); border-radius: 1px; }
.legend i.tick { width: 3px; border-radius: 1px; }
.legend i.strike { background-image: linear-gradient(135deg, transparent 44%, var(--text) 44% 56%, transparent 56%) !important; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); hyphens: manual; overflow-wrap: break-word; min-height: 2.6em; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.4; }
.ptile .pbar { display: flex; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--line); }
.ptile .pbar i { display: block; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mini { gap: 12px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Langue / Language"><button data-lang="fr">FR</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Affichage / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile, ACTS = DATA.acts;
const LANGS = ['fr', 'en'];
let LANG = 'fr';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('dz-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('dz-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
fr: {
  title: 'Le droit algérien en 20 graphiques',
  lede: 'Vingt graphiques tirés uniquement des données de ce dépôt : la Constitution telle que révisée en 2020 et le 26 mars 2026, six codes et 148 lois, lois organiques et ordonnances publiés au Journal officiel de 2002 à 2026, soit {acts} textes et {versions} versions, chacune datée du jour de son entrée en vigueur et attribuée au texte qui l’a faite. Le texte est celui de l’édition française du Journal officiel ; 148 textes n’y figurent que tels qu’adoptés.',
  profile_h: 'Profil des données : ce qui a été utilisé et dans quelle mesure c’est complet',
  tbl: 'Tableau des données', src: 'Source dans le dépôt', n: 'Enregistrements', cover: 'Couverture', caveat: 'Limite',
  ds: 'Données', foot: 'Construit à partir du dépôt lexifina/algeria-law ({built}). Source des textes : le Journal officiel de la République algérienne démocratique et populaire (édition française) et, pour la première version du Code pénal, l’édition 2005 du ministère de la Justice. Les chiffres sont calculés par visualisations/src/prep.py à partir de l’historique git, du texte des articles et des tableaux de data/ ; build.py assemble la page. Tous les graphiques sont descriptifs : ils montrent ce que les sources enregistrent, pas pourquoi.',
  tiles: ['textes', 'versions', 'articles', 'mots', 'lois que nomme le registre', 'versions du Code pénal'],
  year: 'Année', total: 'Total', share: 'Part', count: 'Nombre', partial: 'année incomplète', days: 'jours',
  gl: 'Des graphiques sur le droit de tous les pays, tirés de l’ensemble de global-law : ' + GL + '. Ici figurent uniquement les graphiques sur l’Algérie.',
},
en: {
  title: 'Algerian law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the Constitution as revised in 2020 and on 26 March 2026, six codes and 148 laws, organic laws and ordinances published in the Journal officiel from 2002 to 2026, that is {acts} texts and {versions} versions, each dated by the day it took effect and credited to the text that made it. The text is that of the French edition of the Journal officiel; 148 texts are here only as enacted.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/algeria-law repository ({built}). Source of the texts: the Journal officiel of the People’s Democratic Republic of Algeria (French edition) and, for the first version of the Penal Code, the Ministry of Justice’s 2005 edition. The numbers are computed by visualisations/src/prep.py from the git history, the text of the articles and the tables in data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['texts', 'versions', 'articles', 'words', 'laws the register names', 'versions of the Penal Code'],
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year', days: 'days',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Algeria alone.',
}};
// French: a narrow no-break space before : ; ! ? » and after «, so the sign never starts a line.
const NNB = ' ', NB = ' ';
const FRP = s => typeof s === 'string' ? s.replace(/ ([:;!?»])/g, NNB + '$1').replace(/« /g, '«' + NNB) : s;
const t = k => LANG === 'fr' ? FRP(S.fr[k]) : S[LANG][k];
const L = (fr, en) => LANG === 'fr' ? FRP(fr) : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
// French: a narrow no-break space between thousands, a decimal comma and a narrow no-break space before %; English: en-GB.
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'fr' ? NNB : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'en' ? '.' : ',') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'en' ? '%' : NNB + '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MFR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const MLET = { fr: ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'], en: ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'] };
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d}${NB}${MFR[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d}${NB}${MON.fr[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const YF = s => { const d = PD(s); return d.getFullYear() + (d3.timeDay.count(d3.timeYear(d), d) + .5) / 365.25; };   // a day as a fractional year
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// nouns after a number: nn(5, ['loi', 'lois'], ['law', 'laws'])
const nn = (n, fr, en) => { const w = L(fr, en); return `${fmt(n)}${NB}${(LANG === 'fr' ? n < 2 : n === 1) ? w[0] : w[1]}`; };
const jours = v => LANG === 'fr' ? `${dec(v, Number.isInteger(v) ? 0 : 1)}${NB}${v < 2 ? 'jour' : 'jours'}` : `${dec(v, Number.isInteger(v) ? 0 : 1)} ${v === 1 ? 'day' : 'days'}`;
const ans = v => LANG === 'fr' ? `${fmt(v)}${NB}${v < 2 ? 'an' : 'ans'}` : `${fmt(v)} ${v === 1 ? 'year' : 'years'}`;
const DA = v => `${fmt(v)}${NB}DA`;
const andFr = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1];
const andEn = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;
const tq = s => `<div class="q">${esc(s)}</div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.bc || it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
// a second table under the first, inside the same "data table" fold
function subTable(el, heading, head, rows, numeric) {
  const nd = el.select('details.tbl:last-of-type .scroll');
  nd.append('h4').style('margin', '14px 0 6px').style('font', '600 13px/1.3 Inter, sans-serif').text(heading);
  const tb = nd.append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => numeric && numeric[i] ? 'n' : null).text(x => x);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => numeric && numeric[i] ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
// path placeholders, by language
const PH = { '<AN>': ['<année>', '<year>'], '<NUM>': ['<numéro>', '<number>'], '<NATURE>': ['<nature>', '<kind>'], '<ART>': ['<article>', '<article>'] };
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);

// ---- 5. the Constitution article by article
chart('c05', el => {

const cpGroup = r => r.c === 'none' ? 'none' : r.c === 'note' ? (r.y < 1990 ? 'n70' : 'n90') : r.y === 2006 ? 'g06' : r.y <= 2016 ? 'g09' : r.y <= 2021 ? 'g20' : r.y === 2024 ? 'g24' : 'g26';

chart('c11', el => {

      `Each square is an article of the Penal Code in the repository, in the code’s order; its colour says which text wrote its current wording. For an article unchanged since 2005, that is the note in the Ministry of Justice’s edition; ${fmt(cnt('none'))} articles carry none. The code keeps its 1966 numbering: ${fmt(bis)} articles are bis, ter and later articles inserted between two numbers. The struck-through squares are ${fmt(ab.length)} articles that another law in the repository repeals and that are still in the repository’s Penal Code: ${abBy.map(([f, n]) => `${fmt(n)} by ${citeKind(NOM(f)).replace(/^Law/, 'law').replace(/^Ordinance/, 'ordinance')}`).join(', ')}.`),

      const lab = i => LA(A87[i] || [V[V.length - 1].items[i], V[V.length - 1].items[i]]);

        L('les actes sont les lignes à tiret de l’article, comparées d’une version à l’autre à la même place ; une ligne est reformulée si son texte change (hors ponctuation finale). Les libellés résument chaque ligne ; le texte exact est dans les infobulles. En 2024, la ligne des attentats ajoute « ou toute autre arme de destruction massive ».',

    }

part('p4', 'IV. Remplacer et modifier', 'IV. Replacing and amending',
  'Ce que les textes du dépôt abrogent, ce qu’ils reprennent des textes qu’ils remplacent, et ce qui leur arrive après leur adoption : le dépôt n’applique les modifications qu’à quelques textes et ne marque pas les abrogations.',
  'What the texts in the repository repeal, what they take over from the texts they replace, and what happens to them after enactment: the repository applies amendments to a few texts only and does not mark repeals.');

// ---- 15. what the texts in the repository repeal
chart('c15', el => {
  const R = D.c14.slice().sort((a, b) => a.y - b.y || (a.d < b.d ? -1 : 1)), N = R.length, age = r => r.y_by - r.y, med = d3.median(R, age), held = R.filter(r => r.held);
  const longest = R.slice().sort((a, b) => age(b) - age(a)).slice(0, 2), y90 = R.filter(r => r.y >= 1989 && r.y <= 1991).length;
  const kindFr = r => ({ ordonnance: 'l’ordonnance', loi: 'la loi', 'décret législatif': 'le décret législatif' }[r.kind] || r.kind), kindEn = r => ({ ordonnance: 'ordinance', loi: 'law', 'décret législatif': 'legislative decree' }[r.kind] || r.kind);
  const byFr = r => `${NOM(r.by).replace(/^Loi organique/, 'la loi organique').replace(/^Loi/, 'la loi').replace(/^Ordonnance/, 'l’ordonnance')} (${r.fr.charAt(0).toLowerCase() + r.fr.slice(1)})`;
  const byEn = r => `${citeKind(NOM(r.by)).replace(/^Law/, 'law').replace(/^Organic law/, 'organic law').replace(/^Ordinance/, 'ordinance')} (${r.en})`;
  return {
    title: L(`Les textes du dépôt abrogent ${fmt(N)} textes plus anciens, en vigueur depuis ${ans(med)} en médiane`, `The texts in the repository repeal ${fmt(N)} older texts, in force for ${ans(med)} at the median`),
    dek: L(`Chaque trait est un texte qu’un texte du dépôt abroge en entier dans ses dispositions finales (« Sont abrogées les dispositions de la loi n° 90-08… »), de sa date à celle du texte qui l’abroge. Les deux plus longs : ${longest.map(r => `${kindFr(r)} n° ${r.num} de ${r.y}, abrogé${r.kind === 'décret législatif' ? '' : 'e'} en ${r.y_by} par ${byFr(r)} après ${ans(age(r))}`).join(', et ')}. ${fmt(y90)} des textes abrogés datent de 1989 à 1991. En orange, les ${fmt(held.length)} textes abrogés qui sont eux-mêmes dans le dépôt, où ils restent tels qu’adoptés.`,
      `Each line is a text that a text in the repository repeals in full in its final provisions ("Sont abrogées les dispositions de la loi n° 90-08…"), from its date to that of the text that repeals it. The two longest: ${longest.map(r => `${kindEn(r)} n° ${r.num} of ${r.y}, repealed in ${r.y_by} by ${byEn(r)} after ${ans(age(r))}`).join(', and ')}. ${fmt(y90)} of the repealed texts date from 1989 to 1991. In orange, the ${fmt(held.length)} repealed texts that are themselves in the repository, where they remain as enacted.`),
    draw(el) {

      const w = W(el), nw = narrow(w), rowH = nw ? 5.6 : 6.4, END = 2027, m = { t: 6, r: nw ? 62 : 96, b: 24, l: 10 };
      const h = N * rowH + m.t + m.b, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), iw = w - m.l - m.r;
      const x = d3.scaleLinear().domain([1962, END]).range([0, iw]);
      d3.range(1970, 2027, 10).forEach(yy => { g.append('line').attr('x1', x(yy)).attr('x2', x(yy)).attr('y1', 0).attr('y2', N * rowH).attr('stroke', css('--grid')); g.append('text').attr('class', 'lbl mut').attr('x', x(yy)).attr('y', N * rowH + 15).attr('text-anchor', 'middle').text(yy); });
      R.forEach((r, i) => {

        L('une abrogation partielle (des articles, « les dispositions contraires… contenues dans ») ne compte pas ; « toutes dispositions contraires, notamment la loi n° X » compte comme l’abrogation de X. La date d’un texte abrogé est celle que donne l’article d’abrogation. Le Code pénal n’est pas lu : ses mentions d’abrogation sont des notes de l’édition 2005. Un texte abrogé par deux textes du dépôt compte une fois, pour le premier.',

      table(el, [L('Texte abrogé', 'Repealed text'), L('Daté du', 'Dated'), L('Abrogé par', 'Repealed by'), L('Le', 'On'), L('Durée (ans)', 'Lifetime (years)'), L('Dans le dépôt', 'In the repository')],
        R.map(r => [`${citeKind(Cap(r.kind))} n° ${r.num}`, r.d ? dateShort(r.d) : String(r.y), L(r.fr, r.en), dateShort(r.d_by), age(r), r.held ? L('oui', 'yes') : '']));

      splitBars(el, rows, ['proc', 'other'], [cP, cO], names.map(Cap), { rowH: 20, l: lw, ln: lw, rr: 40, label: lab, labelCls: r => r.rest ? 'lbl mut' : 'lbl strong',
        tipExtra: d => trow(null, t('share'), pct(tot(d), N, 1)) });
      note(el, [L('les articles des 155 textes', 'the articles of the 155 texts')], fmt(N) + L(' délais', ' time limits'),
        L('un délai compte quand un nombre en chiffres entre parenthèses suit « délai », « dans les », « au plus tard » ou « avant l’expiration » dans la même phrase ; « quinze jours » sans chiffres ne compte pas. Les durées de peine ne sont pas des délais et ne comptent pas. Les délais cités moins de 8 fois sont regroupés.',
          'a time limit counts when a number in figures in brackets follows "délai", "dans les", "au plus tard" or "avant l’expiration" in the same sentence; "quinze jours" without figures does not count. Prison terms are not time limits and do not count. Limits named fewer than 8 times are grouped.'));
      table(el, [L('Délai', 'Time limit'), Cap(names[0]), Cap(names[1]), t('total')], R.slice().sort((a, b) => a.n * UDAYS[a.u] - b.n * UDAYS[b.u]).map(r => [dlab(r), r.proc, r.other, tot(r)]));
    }
  };
});

// ---- 20. the ranges of imprisonment
const durLab = (mo, short) => { if (mo < 1) { const d = Math.round(mo * 30); return LANG === 'fr' ? `${d}${NB}j` : `${d} d`; } if (mo < 12) return LANG === 'fr' ? `${mo}${NB}mois` : `${mo} mo`; const y = mo / 12; return LANG === 'fr' ? `${dec(y, Number.isInteger(y) ? 0 : 1)}${NB}${y < 2 ? 'an' : 'ans'}` : `${dec(y, Number.isInteger(y) ? 0 : 1)} ${short ? 'y' : (y === 1 ? 'year' : 'years')}`; };
// a range in words, as the texts write it: « de deux à cinq ans », « d’un à cinq ans », « de six mois à deux ans »
const WFR = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze'], WEN = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const rangeWords = (a, b) => {
  const yr = v => v % 12 === 0 && v / 12 <= 12, w = v => yr(v) ? v / 12 : v, u = v => yr(v) ? 'y' : 'm';
  const W_ = n_ => (LANG === 'fr' ? WFR : WEN)[n_] || String(n_), UF = (n_, k) => k === 'y' ? (n_ < 2 ? 'an' : 'ans') : 'mois', UE = (n_, k) => k === 'y' ? (n_ === 1 ? 'year' : 'years') : (n_ === 1 ? 'month' : 'months');
  if (LANG === 'fr') { const da = w(a) === 1 ? 'd’un' : 'de ' + W_(w(a)); return u(a) === u(b) ? `${da} à ${W_(w(b))} ${UF(w(b), u(b))}` : `${da} ${UF(w(a), u(a))} à ${W_(w(b))} ${UF(w(b), u(b))}`; }
  return u(a) === u(b) ? `${W_(w(a))} to ${W_(w(b))} ${UE(w(b), u(b))}` : `${W_(w(a))} ${UE(w(a), u(a))} to ${W_(w(b))} ${UE(w(b), u(b))}`;
};
chart('c20', el => {
  const C = D.c19.cells, P = C.filter(c => c.cp + c.other), pt = c => c.cp + c.other, N = sum(P, pt), top = P.slice().sort((a, b) => pt(b) - pt(a));
  const R = C.filter(c => c.recl).sort((a, b) => b.recl - a.recl);
  return {
    title: L(`L’emprisonnement : « ${rangeWords(top[0].a, top[0].b)} » revient ${fmt(pt(top[0]))} fois, « ${rangeWords(top[1].a, top[1].b)} » ${fmt(pt(top[1]))} fois`,
      `Imprisonment: "${rangeWords(top[0].a, top[0].b)}" occurs ${fmt(pt(top[0]))} times, "${rangeWords(top[1].a, top[1].b)}" ${fmt(pt(top[1]))} times`),
    dek: L(`Chaque case croise le minimum (en ligne) et le maximum (en colonne) d’une fourchette d’emprisonnement que fixe un texte du dépôt, comme « un emprisonnement de deux (2) ans à cinq (5) ans » ; la couleur et le chiffre disent combien de fois elle revient, dans le Code pénal et ailleurs. À droite, le total de chaque minimum. Les fourchettes de la réclusion à temps sont à part (tableau) : « de dix à vingt ans » revient ${fmt(R[0].recl)} fois.`,
      `Each cell crosses the minimum (row) and the maximum (column) of a range of imprisonment set by a text in the repository, such as "imprisonment from two (2) years to five (5) years"; the colour and figure say how often it occurs, in the Penal Code and elsewhere. On the right, the total for each minimum. Ranges of fixed-term réclusion are kept apart (table): "ten to twenty years" occurs ${fmt(R[0].recl)} times.`),
    draw(el) {
      const mins = [...new Set(P.map(c => c.a))].sort((a, b) => a - b), maxs = [...new Set(P.map(c => c.b))].sort((a, b) => a - b);
      const keepMin = mins.filter(a => sum(P.filter(c => c.a === a), pt) >= 3), keepMax = maxs.filter(b => sum(P.filter(c => c.b === b), pt) >= 3);
      const cells = P.filter(c => keepMin.includes(c.a) && keepMax.includes(c.b)), shown = sum(cells, pt);
      const w = W(el), nw = narrow(w), ramp = seqRamp(), mx = d3.max(cells, pt), col = v => ramp(.12 + .88 * Math.sqrt(v / mx));
      legend(el, [1, 10, 30, 60, mx].map(v => ({ c: col(v), l: v === 1 ? '1' : fmt(v) })));
      const lw = Math.max(textW(el, keepMin.map(a => durLab(a))), textW(el, [L('minimum ↓', 'minimum ↓')], 'lbl mut')) + 14, rw = nw ? 34 : 90;
      const cs = Math.min(40, (w - lw - rw) / keepMax.length), gap = 2;
      // on a phone the column heads stand upright
      const headW = nw ? textW(el, keepMax.map(b => durLab(b, true)), 'lbl') : 0, top_ = nw ? headW + 26 : 34;
      const h = keepMin.length * cs + top_ + 8, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${lw},${top_})`);
      g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', -top_ + 10).text(L('maximum →', 'maximum →'));
      g.append('text').attr('class', 'lbl mut').attr('x', -8).attr('y', -8).attr('text-anchor', 'end').text(L('minimum ↓', 'minimum ↓'));
      keepMax.forEach((b, j) => {
        const cx = j * cs + (cs - gap) / 2;
        if (nw) g.append('text').attr('class', 'lbl').attr('transform', `translate(${cx + 3.5},-6) rotate(-90)`).text(durLab(b, true));
        else g.append('text').attr('class', 'lbl').attr('x', cx).attr('y', -8).attr('text-anchor', 'middle').style('font-size', '10.5px').text(durLab(b, true));
      });
      const rowTot = a => sum(P.filter(c => c.a === a), pt), mxT = d3.max(keepMin, rowTot);
      keepMin.forEach((a, i) => {
        const cy = i * cs;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + (cs - gap) / 2 + 4).attr('text-anchor', 'end').text(durLab(a));
        keepMax.forEach((b, j) => {
          const c = cells.find(c_ => c_.a === a && c_.b === b);
          if (!c) { if (b > a) g.append('rect').attr('x', j * cs).attr('y', cy).attr('width', cs - gap).attr('height', cs - gap).attr('rx', 4).attr('fill', css('--surface-2')); return; }
          const v = pt(c), f = col(v);
          const r = g.append('rect').attr('x', j * cs).attr('y', cy).attr('width', cs - gap).attr('height', cs - gap).attr('rx', 4).attr('fill', f);
          if (v >= (nw ? 10 : 3)) g.append('text').attr('class', 'lbl').attr('x', j * cs + (cs - gap) / 2).attr('y', cy + (cs - gap) / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(f)).style('font-size', nw ? '9px' : '10.5px').style('pointer-events', 'none').text(fmt(v));
          bindTip(r.datum(c), d => `<b>${L('de', 'from')} ${durLab(d.a)} ${L('à', 'to')} ${durLab(d.b)}</b>` + trow(f, L('Occurrences', 'Occurrences'), fmt(pt(d))) + trow(null, L('dans le Code pénal', 'in the Penal Code'), fmt(d.cp)) + trow(null, L('dans les autres textes', 'in other texts'), fmt(d.other)));
        });
        const bx = keepMax.length * cs + 6, bwid = rw - (nw ? 0 : 40);
        if (!nw) g.append('path').attr('d', barPath(bx, cy + cs * .3, bx + bwid * rowTot(a) / mxT, Math.max(4, cs * .4 - gap), 2)).attr('fill', ramp(.55));
        g.append('text').attr('class', 'lbl').attr('x', nw ? bx : bx + bwid * rowTot(a) / mxT + 5).attr('y', cy + (cs - gap) / 2 + 4).text(fmt(rowTot(a)));
      });
      note(el, [L('les articles des 155 textes', 'the articles of the 155 texts')], fmt(N) + L(' fourchettes d’emprisonnement', ' ranges of imprisonment'),
        L(`« emprisonnement de deux (2) ans à cinq (5) ans » et « emprisonnement de deux à cinq ans » comptent de même, à chaque occurrence ; un mois vaut 30 jours. Les minimums et maximums cités moins de trois fois ne sont pas dessinés (${fmt(N - shown)} fourchettes, dans le tableau). ${fmt(D.c19.unparsed)} fourchettes n’ont pas pu être lues.`,
          `"emprisonnement de deux (2) ans à cinq (5) ans" and "emprisonnement de deux à cinq ans" count alike, at each occurrence; a month is 30 days. Minimums and maximums named fewer than three times are not drawn (${fmt(N - shown)} ranges, in the table). ${fmt(D.c19.unparsed)} ranges could not be read.`));
      table(el, [L('Minimum', 'Minimum'), L('Maximum', 'Maximum'), L('Code pénal', 'Penal Code'), L('Autres textes', 'Other texts'), t('total')], top.map(c => [durLab(c.a), durLab(c.b), c.cp, c.other, pt(c)]));
      subTable(el, L('Réclusion à temps', 'Fixed-term réclusion'), [L('Minimum', 'Minimum'), L('Maximum', 'Maximum'), L('Occurrences', 'Occurrences')], R.map(c => [durLab(c.a), durLab(c.b), c.recl]), [0, 0, 1]);
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'p2', 'c05', 'c06', 'c07', 'c08', 'p3', 'c09', 'c10', 'c11', 'c12', 'c13', 'c14', 'p4', 'c15', 'c16', 'c17', 'p5', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Historique git', 'Git history'), 'git log origin/main', fmt(P.commits), L(`${fmt(P.law_commits)} commits de droit : ${fmt(P.acts)} textes tels qu’adoptés et ${fmt(P.amend)} modifications ; dernière entrée en vigueur le ${dateTxt(P.last)}`, `${fmt(P.law_commits)} law commits: ${fmt(P.acts)} texts as enacted and ${fmt(P.amend)} amendments; last entry into force ${dateTxt(P.last)}`), L('chaque commit est daté du jour d’entrée en vigueur (trailer In-force) ; les textes ont été ajoutés par lots', 'each commit is dated by the day the version took effect (In-force trailer); texts were added in batches')],
    [L('Articles', 'Articles'), 'constitution/ code/ loi/ loi-organique/ ordonnance/', fmt(P.files), L(`${fmt(P.articles)} articles et ${fmt(P.words)} mots, une fois retirés les ${fmt(P.runon)} fichiers qui reprennent le texte suivant du Journal officiel`, `${fmt(P.articles)} articles and ${fmt(P.words)} words, once the ${fmt(P.runon)} files that repeat the next text of the Journal officiel are set aside`), L('texte français du Journal officiel ; intitulés des titres et chapitres non enregistrés', 'French text of the Journal officiel; titles of parts and chapters not recorded')],
    [L('Registre des lois', 'Register of laws'), 'data/laws.csv', fmt(P.laws), L(`intitulé, dates de signature et de publication, numéro du Journal officiel ; ${fmt(P.named)} lois nommées sans texte ni version`, `title, dates of signature and publication, issue of the Journal officiel; ${fmt(P.named)} laws named with no text or version`), L('la loi organique n° 26-05, appliquée dans l’historique, n’y figure pas', 'organic law n° 26-05, applied in the history, is missing from it')],
    [L('Versions', 'Versions'), 'data/versions.json, data/commits.csv', fmt(P.versions), L(`${fmt(P.multi.length)} textes ont plus d’une version, dont le Code pénal (${fmt(P.cp_versions)})`, `${fmt(P.multi.length)} texts have more than one version, the Penal Code among them (${fmt(P.cp_versions)})`), L('148 textes tels qu’adoptés : une modification non appliquée n’y est pas', '148 texts as enacted: an amendment not applied is not in them')],
    [L('Dossiers', 'Folders'), 'data/paths.json', fmt(P.acts), L('le dossier de chaque texte (<nature>/<année>/<numéro>) et son ancien nom', 'each text’s folder (<kind>/<year>/<number>) and its former name'), L('l’historique d’avant le 11 novembre 2026 utilise les anciens noms', 'the history before 11 November 2026 uses the former names')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    // an end-anchored label ends at its anchor: the room is from there to the svg's left edge, in the svg's own units (it may be scaled)
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) { const ctm = this.getScreenCTM(); room = (ctm.e + ctm.a * +this.getAttribute('x') - this.ownerSVGElement.getBoundingClientRect().left - 2) / ctm.a; }
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{acts}', fmt(PF.acts)).replace('{versions}', fmt(PF.versions)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.acts, PF.versions, PF.articles, PF.words, PF.laws, PF.cp_versions];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.fr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dfr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.fr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(/\s:|:/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('dz-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('dz-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw once more when the web fonts have loaded, so the measures are the fonts' own
if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => { const y = scrollY; render(); scrollTo(0, y); });
</script>
